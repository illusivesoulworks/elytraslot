plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

group = 'com.illusivesoulworks.elytraslot'
version = '10.0.1+1.21.11-port.1'
base.archivesName = 'elytraslot-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.creeperhost.net/' }
    maven {
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    mavenCentral()
}

dependencies {
    implementation 'net.neoforged:neoforge:21.11.42'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:14.0.0+1.21.11:api'
}

tasks.named('jar', Jar) {
    from 'COPYING', 'COPYING.LESSER', 'LICENSE'
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
